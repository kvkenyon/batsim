# Contract-test configuration for the batsim API.
#
# Two operations get a documented exemption from one check each;
# everything else runs the full check set.

# A plain GET on the WebSocket endpoint (no upgrade headers) is correctly
# rejected with 400; no contract test can negotiate the upgrade, so the
# acceptance check is not meaningful here.
[[operations]]
include-path = "/v1/telemetry/ws"
include-method = "GET"

[operations.checks.positive_data_acceptance]
enabled = false

# Scenario binding rules are cross-field: the end must be after the
# start, the start must align to a settlement boundary, and data sources
# that are not wired up yet are honest 422s. JSON Schema cannot express
# any of that, so generated "valid" documents are sometimes correctly
# rejected.
[[operations]]
include-path = "/v1/scenarios"
include-method = "POST"

[operations.checks.positive_data_acceptance]
enabled = false

# DELETE on a dispatch command is a retraction, not a removal: the
# command document is the audit record, so GET keeps returning it
# with status `cancelled`. The use-after-free check assumes DELETE
# deletes the resource, which does not hold for this endpoint.
[[operations]]
include-path = "/v1/dispatch/commands/{command_id}"
include-method = "DELETE"

[operations.checks.use_after_free]
enabled = false

# Schemathesis's stateful machinery mis-parses path templates where a
# parameter shares a segment with a suffix (`{id}:expand`). The phase
# runs everywhere else; these operations keep their full coverage and
# fuzzing.
[[operations]]
include-path-regex = "\\{id\\}:"

[operations.phases.stateful]
enabled = false
