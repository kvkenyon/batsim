[workspace]
resolver = "2"
members = ["crates/batsim-core", "crates/batsim-registry", "crates/batsim-ercot", "crates/batsim-server", "crates/batsim-cli"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/batsim/batsim"

[workspace.dependencies]
batsim-core = { path = "crates/batsim-core" }
batsim-ercot = { path = "crates/batsim-ercot" }
batsim-registry = { path = "crates/batsim-registry" }
batsim-server = { path = "crates/batsim-server" }

axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
ureq = { version = "3", default-features = false, features = ["json"] }
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ulid = "1"
utoipa = { version = "5", features = ["yaml"] }
futures-util = "0.3"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
time = { version = "=0.3.36", features = ["parsing", "formatting", "serde", "macros"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
libm = "0.2"
include_dir = "0.7"

proptest = "1"
insta = { version = "1", features = ["json"] }

# Captain directive: modern Rust, pedantic-clean. The three cast allows exist
# because physics code converts tick counts (u64, << 2^53) and quantities to
# f64 pervasively; every such site is guarded by range invariants instead.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
# Catalog vocabulary wins: HomeSystem, SystemSpec, RegistryError are the
# catalog type names; renaming to satisfy the lint would obscure the mapping.
module_name_repetitions = "allow"

[profile.release]
# Determinism: no fast-math-equivalent flags; default codegen.
debug = false
